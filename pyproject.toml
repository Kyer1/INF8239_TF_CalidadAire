[project]
name = "calidad-aire"
version = "1.0.0"
description = "Trabajo final INF-8239: alerta temprana de PM2.5 alto con 24 horas de anticipación"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = ["ipykernel>=6.29,<8", "nbconvert>=7.16,<8", "pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calidad_aire"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
